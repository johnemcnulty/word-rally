<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Rally</title>
<meta name="description" content="A race game for learning SAT vocabulary with an adaptive question engine.">
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface2:#faf9f6; --ink:#1c1b18; --muted:#6a665d; --line:#e2ddd2;
  --accent:#2f62e0; --accentInk:#ffffff; --good:#1d8049; --goodBg:#e6f4ec; --bad:#c03a26; --badBg:#fbe9e5;
  --gold:#b7800f; --track:#ece8df; --tick:rgba(0,0,0,.07); --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --p0:#2f62e0; --p1:#e0582a; --p2:#14967f; --p3:#9050b8; --p4:#c2357a; --p5:#6f7f12;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131418; --surface:#1d1e24; --surface2:#24252c; --ink:#ebeae5; --muted:#9b988f; --line:#33343c;
    --accent:#6b93ff; --accentInk:#0d1020; --good:#4cc47f; --goodBg:#16301f; --bad:#ff7a63; --badBg:#3a1c17;
    --gold:#e2b04a; --track:#26272e; --tick:rgba(255,255,255,.06); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --p0:#6b93ff; --p1:#ff8a5c; --p2:#3fcdb2; --p3:#c38cf0; --p4:#f27bb5; --p5:#b9cf4c;
  }
}
:root[data-theme="dark"]{
  --bg:#131418; --surface:#1d1e24; --surface2:#24252c; --ink:#ebeae5; --muted:#9b988f; --line:#33343c;
  --accent:#6b93ff; --accentInk:#0d1020; --good:#4cc47f; --goodBg:#16301f; --bad:#ff7a63; --badBg:#3a1c17;
  --gold:#e2b04a; --track:#26272e; --tick:rgba(255,255,255,.06); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --p0:#6b93ff; --p1:#ff8a5c; --p2:#3fcdb2; --p3:#c38cf0; --p4:#f27bb5; --p5:#b9cf4c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo span{color:var(--accent)}
header .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}

/* Track */
.track{padding:14px 16px 10px}
.trackHead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:0 0 6px 92px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.lane{display:flex;align-items:center;gap:10px;height:44px}
.laneName{width:82px;flex:none;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.laneName small{display:block;font-weight:500;color:var(--muted);font-size:11px;line-height:1.1}
.road{position:relative;flex:1;height:30px;border-radius:15px;background:var(--track);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--cell) - 1px),var(--tick) calc(var(--cell) - 1px) var(--cell));}
.road::after{content:"";position:absolute;right:0;top:0;bottom:0;width:10px;border-radius:0 15px 15px 0;
  background:repeating-linear-gradient(0deg,var(--ink) 0 5px,var(--surface) 5px 10px);opacity:.55}
.token{position:absolute;top:1px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:800;color:#fff;left:calc((100% - 38px) * var(--p));transition:left .55s cubic-bezier(.3,1.3,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:2}
.token.me{outline:3px solid var(--surface);outline-offset:-1px}
.badges{position:absolute;top:-9px;left:calc((100% - 38px) * var(--p) + 20px);display:flex;gap:1px;font-size:12px;transition:left .55s;z-index:3;pointer-events:none}
.badges b{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 3px;line-height:15px;font-size:11px}
.lane.targetable .road{outline:2px dashed var(--bad);outline-offset:2px;cursor:pointer}
.float{position:absolute;top:-4px;font-weight:800;font-size:15px;pointer-events:none;z-index:5;animation:rise 1.3s ease-out forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Main grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;margin-top:14px;align-items:start}
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .track{position:sticky;top:0;z-index:20;padding:8px 12px 6px;border-radius:0 0 14px 14px}
  .lane{height:32px}
  .road{height:24px}
  .token{width:22px;height:22px;font-size:10px;top:1px}
  .trackHead{margin-bottom:2px}
  /* On phones, cards you hold sit above the question so they're never out of sight. */
  .grid > .side{display:contents}
  .grid > .qcard{order:2}
  .grid .side .panel{order:3}
  .grid .side .handPanel.hasCards{order:1}
  .handPanel.hasCards .hand{grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);overflow-x:auto}
}

/* Question */
.qcard{padding:20px 22px 22px;min-height:360px}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chip.review{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:var(--badBg)}
.chip.frozen{color:#2b8fd6;border-color:#9fd0f2}
.stageDots{display:inline-flex;gap:3px;margin-left:auto;align-items:center;font-size:11px;color:var(--muted)}
.stageDots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.stageDots i.on{background:var(--accent)}
.stem{font-size:19px;line-height:1.5;margin:4px 0 16px}
.stem .big{font-size:30px;font-weight:800;letter-spacing:-.01em;display:block;margin-bottom:2px}
.stem blockquote{margin:0 0 12px;padding:12px 16px;border-left:4px solid var(--accent);background:var(--surface2);border-radius:0 10px 10px 0;font-size:18px}
.stem mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:4px;padding:0 3px;font-weight:700}
.blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--ink);margin:0 2px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px;transition:border-color .12s,background .12s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--goodBg)}
.opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--badBg)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.5}
.feedback{margin-top:14px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface2)}
.feedback h3{margin:0 0 4px;font-size:16px}
.feedback.ok h3{color:var(--good)} .feedback.no h3{color:var(--bad)}
.feedback p{margin:4px 0}
.feedback .ex{color:var(--muted);font-style:italic}
.fbRow{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.fbRow .hint{font-size:12px;color:var(--muted)}
.waiting{color:var(--muted);text-align:center;padding:60px 0;font-weight:600}

/* Side */
.side{display:grid;gap:14px}
.side .panel{padding:14px 16px}
.side h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.streak{display:flex;gap:6px}
.pip{flex:1;height:12px;border-radius:6px;background:var(--track);position:relative}
.pip.on{background:var(--accent)}
.pip.m3::after,.pip.m5::after{position:absolute;top:15px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap}
.pip.m3::after{content:"attack"} .pip.m5::after{content:"power"}
.pip.m5.on{background:var(--gold)}
.streakNote{height:16px}
.hand{display:grid;gap:8px}
.card{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);padding:9px 10px}
.card .ic{font-size:22px;line-height:1}
.card .nm{font-weight:800}
.card .nm em{font-weight:500;font-style:italic;color:var(--muted);font-size:12px;margin-left:4px}
.card .gl{font-size:12px;color:var(--muted);font-style:italic}
.card .ef{font-size:13px}
.card.power{border-color:var(--gold)}
.card.power .nm{color:var(--gold)}
button.card:hover:not(:disabled){border-color:var(--accent)}
button.card:disabled{opacity:.55;cursor:default}
.empty{font-size:13px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;font-size:13px;max-height:230px;overflow:auto}
.log li{padding:5px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border:0}
.log .who{font-weight:700}
.log li.fresh{animation:flash 1s}
@keyframes flash{from{background:color-mix(in srgb,var(--accent) 14%,transparent)}to{background:transparent}}

.labSearch{width:100%;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);margin:0 0 10px}
.src{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;padding:1px 5px;border-radius:5px;border:1px solid var(--line);color:var(--muted);margin-right:3px}
.posTag{font-weight:400;color:var(--muted);font-size:11px;font-style:italic}

/* Online */
.timer{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin:-4px 0 14px}
.timer > span{display:block;height:100%;width:100%;background:var(--accent);transition:width .2s linear}
.timer > span.low{background:var(--bad)}
.secsLeft{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:14px}
.opt.pending{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.reveal{text-align:center;padding:26px 0 10px;color:var(--muted);font-weight:600}
.reveal .cd{font-size:56px;font-weight:800;color:var(--ink);line-height:1.1}
.revealHead{margin:14px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.roomCode{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;color:var(--accent)}
.joinRow{display:flex;gap:8px}
.joinRow input{flex:1;min-width:0;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
#code{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;max-width:160px}
.lobbyHead{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.lobbyList,.standings{list-style:none;margin:0 0 14px;padding:0}
.lobbyList li,.standings li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.standings li .sp{flex:1}
.tag{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.note{background:var(--surface2);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:14px}
[hidden]{display:none!important}

/* Toasts & rivals' turn */
.toasts{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:70;display:grid;gap:6px;width:min(460px,calc(100% - 24px));pointer-events:none}
.toast{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px;
  box-shadow:0 8px 28px rgba(0,0,0,.22);font-size:15px;animation:tin .25s ease-out;transition:opacity .3s,transform .3s}
.toast.good{border-left-color:var(--good)} .toast.bad{border-left-color:var(--bad)} .toast.info{border-left-color:var(--accent)}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.turnEvents{list-style:none;margin:6px 0 0;padding:0;font-size:16px}
.turnEvents li{padding:9px 0;border-bottom:1px solid var(--line);animation:fade .25s}
.turnEvents li.pending{color:var(--muted);border:0}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,10,15,.5);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px}
.modal.wide{width:min(820px,100%)}
.modal h2{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
.modal .sub{color:var(--muted);margin:0 0 16px}
.choices{display:grid;gap:10px}
.choices .card{padding:12px 14px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface2);padding:9px 6px;font-size:14px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accentInk)}
.rules{font-size:14px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:12px 14px;margin:6px 0 16px}
.rules ul{margin:6px 0 0;padding-left:18px}
.rowEnd{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.targets{display:grid;gap:8px}
.tgt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);text-align:left}
.tgt:hover{border-color:var(--bad)}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.tgt .sp{flex:1}
.tgt small{color:var(--muted)}
table.lab{width:100%;border-collapse:collapse;font-size:14px}
table.lab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:-22px;background:var(--surface)}
table.lab td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.lab td.w{font-weight:700}
.hist{display:inline-flex;gap:3px}
.hist i{width:9px;height:9px;border-radius:50%;display:inline-block}
.hist .h1{background:var(--good)} .hist .h0{background:var(--bad)}
.bar{height:8px;border-radius:4px;background:var(--track);width:90px;display:inline-block;vertical-align:middle;margin-right:6px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent)}
.bar.hot > span{background:var(--bad)}
.mult{font-variant-numeric:tabular-nums;font-weight:700}
.stat{display:flex;gap:12px;margin:12px 0}
.stat div{flex:1;background:var(--surface2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--muted)}
.missList{margin:0;padding-left:18px}
.missList li{margin:3px 0}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:22px 0 6px}
@media (max-width:520px){
  .wrap{padding:12px}
  .laneName{width:58px;font-size:13px}
  .trackHead{margin-left:68px}
  .qcard{padding:16px}
  .stem{font-size:17px} .stem .big{font-size:26px} .stem blockquote{font-size:16px}
  header .btn{padding:7px 10px;font-size:13px}
  .hideSm{display:none}
}
</style>
</head>
<body>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="wrap">
  <header>
    <div class="logo">Word<span>Rally</span></div>
    <div class="sp"></div>
    <button class="btn" id="labBtn">Word Lab</button>
    <button class="btn" id="newBtn">New race</button>
  </header>

  <section class="panel track" id="track" aria-label="Race track"></section>

  <div class="grid">
    <section class="panel qcard" id="qcard" aria-live="polite"></section>
    <aside class="side">
      <div class="panel">
        <h4>Your streak</h4>
        <div class="streak" id="streak"></div>
        <div class="streakNote"></div>
      </div>
      <div class="panel handPanel" id="handPanel">
        <h4>Your attacks <span class="hideSm" style="text-transform:none;letter-spacing:0;font-weight:500">(click to use)</span></h4>
        <div class="hand" id="hand"></div>
      </div>
      <div class="panel">
        <h4>Race log</h4>
        <ul class="log" id="log"></ul>
      </div>
    </aside>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>
"use strict";
/* ------------------------------------------------------------------
   WORD BANK
   Each word carries four retrieval contexts:
     def      - "X most nearly means..."            (word -> meaning)
     ctx      - word used in a sentence -> meaning  (word in context -> meaning)
     cloze    - a different sentence with a blank   (context -> word)
     desc     - a description of the idea           (meaning -> word)
------------------------------------------------------------------- */
// 476 words drawn from three lists built from official and reported digital SAT material
// (PrepScholar, MathChops, The Test Advantage). Definitions and sentences are original.
// If a words.json file sits next to this page (e.g. on GitHub Pages), it replaces this list.

/* ------------------------------------------------------------------
   ADAPTIVE ENGINE
------------------------------------------------------------------- */
const STAGES = [
  {key:"def",      label:"Definition"},
  {key:"context",  label:"In context"},
  {key:"cloze",    label:"Complete the sentence"},
  {key:"describe", label:"Name the word"},
];
const MASTERED = 4;      // stage after clearing all four contexts
const COOLDOWN = 3;      // a word can't reappear within this many questions
const ACTIVE_MAX = 8;    // max words in progress before new words wait their turn
const GRADUATE = 3;      // a word stops counting as "in progress" after 3 question types answered right
const NEW_EVERY = 4;     // every 4th question is a brand-new word, whatever the cap says
let sinceNew = 0;        // questions since the last brand-new word
const STATS = {};        // per-word learning state; survives across races until page closes
const recent = [];

function stat(w){
  return STATS[w] || (STATS[w] = {seen:0,right:0,wrong:0,runRight:0,stage:0,hist:[]});
}
// The multipliers from the design: new 1x, correct 0.7x, correct twice 0.4x, wrong 3x, repeated wrong 5x.
function weightOf(w){
  const s = stat(w);
  if (!s.seen) return 1;
  const last = s.hist[s.hist.length-1];
  if (last === 0) return s.wrong >= 2 ? 5 : 3;
  return s.runRight >= 2 ? 0.4 : 0.7;
}
function weightLabel(w){
  const s = stat(w);
  if (!s.seen) return "new";
  const last = s.hist[s.hist.length-1];
  if (last === 0) return s.wrong >= 2 ? "missed again" : "missed";
  return s.runRight >= 2 ? "right 2+ in a row" : "right once";
}
// Words enter play gradually so each one gets repeated practice: while ACTIVE_MAX words are
// in progress (seen, but not yet right in GRADUATE question types), new words wait. Every
// NEW_EVERY-th question is a new word anyway, so the deck keeps moving. Graduated words come
// back at their low weight, which is when they meet the remaining question types.
function learningCount(){ return WORDS.filter(x=>{const s=stat(x.w); return s.seen && s.stage<GRADUATE;}).length; }
function queued(w){ return !stat(w).seen && learningCount() >= ACTIVE_MAX; }
function eligible(){
  const pool = WORDS.filter(x => !recent.includes(x.w));
  return pool.length ? pool : WORDS;
}
function effectiveWeights(){
  const pool = eligible();
  const full = learningCount() >= ACTIVE_MAX;
  const newTurn = sinceNew >= NEW_EVERY - 1 && pool.some(x => !stat(x.w).seen);
  let ws = pool.map(x => {
    const fresh = !stat(x.w).seen;
    if (newTurn) return fresh ? 1 : 0;          // this question introduces a new word
    return fresh && full ? 0 : weightOf(x.w);
  });
  if (!ws.some(v=>v>0)) ws = pool.map(x => weightOf(x.w));
  return {pool, ws, tot: ws.reduce((a,b)=>a+b,0)};
}
function drawChances(){
  const {pool, ws, tot} = effectiveWeights();
  const out = {};
  WORDS.forEach(x => { const i = pool.indexOf(x); out[x.w] = i>=0 ? ws[i]/tot : 0; });
  return out;
}
function pickWord(){
  const {pool, ws, tot} = effectiveWeights();
  let r = Math.random()*tot;
  for (let i=0;i<pool.length;i++){ r -= ws[i]; if (r <= 0 && ws[i]>0) return pool[i]; }
  return pool[ws.findIndex(v=>v>0)];
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function confusable(a,b){ return a.conf.has(b.w) || b.conf.has(a.w); }
function stemOf(w){ return w.length>4 && /[ey]$/.test(w) ? w.slice(0,-1) : w; }
// Highlights the word (or its inflected form) in a sentence; picks the token closest in length to the headword.
function highlight(sentence, w){
  const html = esc(sentence), st = stemOf(w).toLowerCase();
  let best = null;
  html.replace(/[A-Za-z\u00C0-\u00FF'-]+/g, (tok, off) => {
    if (tok.toLowerCase().startsWith(st)){ const d = Math.abs(tok.length - w.length); if (!best || d < best.d) best = {tok, off, d}; }
    return tok;
  });
  return best ? html.slice(0,best.off) + "<mark>" + best.tok + "</mark>" + html.slice(best.off + best.tok.length) : html;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function makeQuestion(item){
  const s = stat(item.w);
  const stage = s.stage < MASTERED ? s.stage : 1 + Math.floor(Math.random()*3);
  const type = STAGES[stage].key;
  let others = shuffle(WORDS.filter(x => x!==item && x.pos===item.pos && !confusable(x,item))).slice(0,3);
  if (others.length < 3) others = others.concat(shuffle(WORDS.filter(x => x!==item && x.pos!==item.pos && !confusable(x,item))).slice(0, 3-others.length));
  const asWords = (type==="cloze"||type==="describe");
  const opts = shuffle([item, ...others]);
  const options = opts.map(x => asWords ? x.w : x.def);
  const answer = opts.indexOf(item);
  let stem;
  if (type==="def"){
    stem = `<span class="big">${item.w}</span>most nearly means…`;
  } else if (type==="context"){
    stem = `<blockquote>${highlight(item.ctx, item.w)}</blockquote>As used in the sentence, <b>${item.w}</b> most nearly means…`;
  } else if (type==="cloze"){
    stem = `<blockquote>${esc(item.cloze).replace("___",'<span class="blank"></span>')}</blockquote>Which word best completes the sentence?`;
  } else {
    stem = esc(item.desc);
  }
  return {item, stage, type, label:STAGES[stage].label, stem, options, answer, wasMissed: s.wrong>0};
}
function recordAnswer(item, ok){
  const s = stat(item.w);
  sinceNew = s.seen ? sinceNew + 1 : 0;
  s.seen++; s.hist.push(ok?1:0); if (s.hist.length>20) s.hist.shift();
  if (ok){ s.right++; s.runRight++; s.stage = Math.min(MASTERED, s.stage+1); }
  else   { s.wrong++; s.runRight = 0; s.stage = Math.max(0, s.stage-1); }
  recent.push(item.w); while (recent.length > COOLDOWN) recent.shift();
}

const TIER2 = Object.keys(CARDS).filter(k=>CARDS[k].tier===2);

const BOTS = [
  {name:"Vex",   tag:"bot"},
  {name:"Quill", tag:"bot"},
  {name:"Nova",  tag:"bot"},
];
const LEVELS = {easy:[.5,.56,.62], medium:[.62,.7,.78], hard:[.76,.83,.9]};
const LENGTHS = {short:20, standard:30, long:40};
let settings = {name:"You", length:"standard", level:"medium"};
let G = null;

/* ------------------------------------------------------------------
   SAVED PROGRESS
   Word history is saved in this browser, separately for each player
   name, so two people sharing a computer keep their own progress.
   If storage is blocked (private mode, some embedded previews), the
   game still works and simply forgets on reload.
------------------------------------------------------------------- */
const STORE_KEY = "wordRally.v1";
function storeRead(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }
function storeWrite(obj){ try { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); return true; } catch (e) { return false; } }
const STORAGE_OK = (()=>{ try { const k="__wr_test"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; } catch (e) { return false; } })();
let store = storeRead();
let currentProfile = null;
const profileKey = name => (name||"You").trim().toLowerCase();
if (store.settings) Object.assign(settings, store.settings);
function loadProfile(name){
  Object.keys(STATS).forEach(k=>delete STATS[k]); recent.length = 0;
  const p = (store.profiles||{})[profileKey(name)];
  if (p && p.stats) for (const [w,st] of Object.entries(p.stats))
    STATS[w] = Object.assign({seen:0,right:0,wrong:0,runRight:0,stage:0,hist:[]}, st);
  currentProfile = profileKey(name);
}
function saveProgress(){
  if (!STORAGE_OK) return;
  store = storeRead();                       // pick up saves from other tabs first
  store.settings = settings;
  store.profiles = store.profiles || {};
  store.profiles[currentProfile] = {name: settings.name, stats: Object.fromEntries(Object.entries(STATS).filter(([,v])=>v.seen)), updated: Date.now()};
  storeWrite(store);
}
function profileSummary(name){
  const p = (store.profiles||{})[profileKey(name)];
  if (!p || !p.stats) return null;
  const st = Object.values(p.stats);
  return {seen: st.filter(x=>x.seen).length, cleared: st.filter(x=>x.stage>=MASTERED).length, missed: st.filter(x=>x.hist && x.hist[x.hist.length-1]===0).length};
}
loadProfile(settings.name);

function newGame(){
  const acc = LEVELS[settings.level];
  G = {
    len: LENGTHS[settings.length],
    players: [
      {id:0,name:settings.name||"You",human:true,isMe:true,color:"var(--p0)"},
      ...BOTS.map((b,i)=>({id:i+1,name:b.name,human:false,acc:acc[i],color:`var(--p${i+1})`})),
    ].map(p=>Object.assign(p,{pos:0,streak:0,shield:0,frozen:0,dbl:0})),
    hand: [], phase:"idle", q:null, log:[], over:false,
    asked:0, correct:0, missed:new Map(), round:0,
  };
  buildTrack();
  renderSide();
  addLog(`Race to <b>${G.len}</b>. Each correct answer moves you ${STEP} spaces.`);
  humanTurn();
}
const me = () => G.players.find(p=>p.isMe) || G.players[0];
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ------------------------------------------------------------------
   TRACK
------------------------------------------------------------------- */
function buildTrack(){
  const t = document.getElementById("track");
  t.innerHTML = `<div class="trackHead"><span>Start</span><span>Finish · ${G.len}</span></div>` +
    G.players.map(p=>`
      <div class="lane" id="lane${p.id}" data-id="${p.id}">
        <div class="laneName" style="color:${p.color}">${esc(p.name)}<small>${p.isMe?"you":p.acc!=null?Math.round(p.acc*100)+"% bot":(p.connected===false?"away":"")}</small></div>
        <div class="road" style="--cell:calc((100% - 38px) / ${G.len})">
          <div class="token ${p.isMe?"me":""}" style="background:${p.color};--p:0">${esc(p.name[0].toUpperCase())}</div>
          <div class="badges" style="--p:0"></div>
        </div>
      </div>`).join("");
  renderTrack();
}
function renderTrack(){
  G.players.forEach(p=>{
    const lane = document.getElementById("lane"+p.id);
    const f = p.pos/G.len;
    lane.querySelector(".token").style.setProperty("--p",f);
    const b = lane.querySelector(".badges");
    b.style.setProperty("--p",f);
    b.innerHTML = (p.shield?`<b title="Shield">\u{1F6E1}️${p.shield>1?p.shield:""}</b>`:"") +
                  (p.frozen?`<b title="Frozen">❄️${p.frozen>1?p.frozen:""}</b>`:"") +
                  (p.dbl?`<b title="Next advance doubled">×2${p.dbl>1?"·"+p.dbl:""}</b>`:"");
  });
}
function fx(p, text, color){
  const lane = document.getElementById("lane"+p.id); if (!lane) return;
  const road = lane.querySelector(".road");
  const el = document.createElement("div");
  el.className = "float"; el.textContent = text;
  el.style.left = `calc((100% - 38px) * ${p.pos/G.len} + 32px)`;
  el.style.color = color || "var(--ink)";
  road.appendChild(el); setTimeout(()=>el.remove(),1300);
  if (color==="var(--bad)"){ lane.classList.remove("shake"); void lane.offsetWidth; lane.classList.add("shake"); }
}
function addLog(html){
  if (!G) return;
  G.log.unshift(html); if (G.log.length>40) G.log.pop();
  if (G.phase==="bots" && G.turnEvents) G.turnEvents.push(html);
  const ul = document.getElementById("log");
  ul.innerHTML = G.log.map((h,i)=>`<li class="${i===0?"fresh":""}">${h}</li>`).join("");
}
function toast(html, kind="info"){
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast "+kind; el.innerHTML = html;
  box.appendChild(el);
  while (box.children.length>3) box.firstChild.remove();
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),300); }, 3200);
}
const who = p => `<span class="who" style="color:${p.color}">${esc(p.name)}</span>`;

/* ------------------------------------------------------------------
   MOVEMENT & EFFECTS
------------------------------------------------------------------- */
function advance(p){
  if (p.frozen>0){
    p.frozen--; fx(p,"❄ frozen","#2b8fd6");
    addLog(`${who(p)} answered right but was frozen — no move.`);
    if (!p.human && p.frozenByMe){ p.frozenByMe--; toast(`❄ Your freeze worked: <b>${esc(p.name)}</b> answered right but didn't move.`,"good"); }
    return 0;
  }
  let amt = STEP;
  if (p.dbl>0){ p.dbl--; amt *= 2; }
  p.pos = Math.min(G.len, p.pos+amt);
  fx(p, "+"+amt, "var(--good)");
  return amt;
}
function back(t,n){ const was=t.pos; t.pos=Math.max(0,t.pos-n); fx(t,"−"+(was-t.pos),"var(--bad)"); return was-t.pos; }
function steal(src,t,n){
  const got = Math.min(n,t.pos); t.pos -= got; src.pos = Math.min(G.len, src.pos+got);
  fx(t,"−"+got,"var(--bad)"); if (got) fx(src,"+"+got,"var(--good)");
  return got;
}
function freeze(src,t){
  t.frozen = Math.min(2,t.frozen+1);
  if (src.human) t.frozenByMe = (t.frozenByMe||0)+1;
  fx(t,"❄","#2b8fd6");
}
const nm = t => t.human ? "you" : esc(t.name);
// Applies one attack to one target. Returns a short phrase describing what happened.
function strike(src, t, card, fn){
  if (t.shield>0){
    t.shield--; fx(t,"\u{1F6E1} blocked","var(--muted)");
    return {blocked:true, text:`${t.human?"your":esc(t.name)+"'s"} shield blocked it`};
  }
  return {blocked:false, text:fn(t)};
}
function playCard(src, key, target){
  const c = CARDS[key];
  const opps = G.players.filter(p=>p!==src);
  const res = [];   // [{t, blocked, text}]
  const one = fn => { const r = strike(src,target,c,fn); res.push({t:target,...r}); };
  const all = fn => opps.forEach(t => { const r = strike(src,t,c,fn); res.push({t,...r}); });
  switch(key){
    case "repel":   one(t=>{const n=back(t,2); return `${nm(t)} back ${n} (now ${t.pos})`;}); break;
    case "rout":    one(t=>{const n=back(t,4); return `${nm(t)} back ${n} (now ${t.pos})`;}); break;
    case "pilfer":  one(t=>{const n=steal(src,t,1); return n?`stole ${n} from ${nm(t)}`:`${nm(t)} had nothing to steal`;}); break;
    case "plunder": one(t=>{const n=steal(src,t,2); return n?`stole ${n} from ${nm(t)}`:`${nm(t)} had nothing to steal`;}); break;
    case "stymie":  one(t=>{freeze(src,t); return `${nm(t)}'s next move is frozen`;}); break;
    case "deluge":  all(t=>{const n=back(t,2); return `${nm(t)} −${n}`;}); break;
    case "petrify": all(t=>{freeze(src,t); return `${nm(t)} frozen`;}); break;
    case "fortify": src.shield=Math.min(2,src.shield+1); fx(src,"\u{1F6E1}","var(--muted)"); res.push({t:src,text:"shield up"}); break;
    case "bulwark": src.shield=Math.min(2,src.shield+2); fx(src,"\u{1F6E1}\u{1F6E1}","var(--muted)"); res.push({t:src,text:"double shield up"}); break;
    case "amplify": src.dbl=Math.min(3,src.dbl+1); fx(src,"×2","var(--accent)"); res.push({t:src,text:"next advance doubled"}); break;
    case "galvanize":src.dbl=Math.min(3,src.dbl+2); fx(src,"×2 ×2","var(--accent)"); res.push({t:src,text:"next two advances doubled"}); break;
  }
  const summary = res.map(r=>r.text).join("; ");
  const onWhom = c.target==="one" ? ` on ${who(target)}` : "";
  addLog(`${who(src)} used <b>${c.icon} ${c.name}</b>${onWhom}: ${summary}.`);
  // Make every attack you make, and every attack on you, impossible to miss.
  if (src.human){
    const anyLanded = res.some(r=>!r.blocked);
    toast(`${c.icon} <b>${c.name}</b>: ${summary}.${res.some(r=>r.blocked)?" (Their shield is used up.)":""}`, anyLanded?"good":"info");
  } else {
    const mine = res.find(r=>r.t && r.t.human);
    if (mine) toast(mine.blocked ? `\u{1F6E1} Your shield blocked ${esc(src.name)}'s <b>${c.name}</b>!`
                                 : `${c.icon} ${esc(src.name)} hit you with <b>${c.name}</b>: ${key==="stymie"||key==="petrify"?"your next correct answer won't move you":key==="pilfer"||key==="plunder"?"they stole from you":"you're knocked back"}.`,
                    mine.blocked?"good":"bad");
  }
  renderTrack();
  checkWin();
}
// Streak rule: 3 in a row earns an attack, 5 in a row earns a power attack, then the streak starts over.
function bumpStreak(p){
  if (p.streak>=5) p.streak = 0;
  p.streak++;
  return p.streak===3 ? 1 : p.streak===5 ? 2 : 0;
}
function offer(tier){ return shuffle([...(tier===2?TIER2:TIER1)]).slice(0,3); }

function checkWin(){
  if (G.over) return true;
  const w = G.players.find(p=>p.pos>=G.len);
  if (w){ G.over = true; G.phase="over"; renderQuestion(); renderSide(); setTimeout(()=>endScreen(w),900); return true; }
  return false;
}

/* ------------------------------------------------------------------
   TURN FLOW
------------------------------------------------------------------- */
function humanTurn(){
  if (G.over) return;
  G.round++;
  G.q = makeQuestion(pickWord());
  G.phase = "question";
  G.picked = null;
  renderQuestion(); renderSide();
}
async function answer(i){
  if (G && G.online) return onlineAnswer(i);
  if (!G || G.phase!=="question" || modalOpen()) return;
  const q = G.q, p = me(), ok = i===q.answer;
  G.phase = "feedback"; G.picked = i;
  recordAnswer(q.item, ok);
  saveProgress();
  G.asked++;
  let tier = 0, moved = 0;
  if (ok){
    G.correct++;
    tier = bumpStreak(p);
    moved = advance(p);
  } else {
    p.streak = 0;
    G.missed.set(q.item.w, q.item);
    addLog(`${who(p)} missed <b>${q.item.w}</b>.`);
  }
  G.lastMoved = moved;
  renderTrack(); renderQuestion(); renderSide();
  if (checkWin()) return;
  if (tier){
    G.drafting = true;
    await sleep(500);
    const key = await draftModal(tier);
    if (G.hand.length>=HAND_MAX){ const old=G.hand.shift(); addLog(`Hand full — <b>${CARDS[old].name}</b> was discarded.`); }
    G.hand.push(key);
    G.drafting = false;
    renderSide();
    toast(`${CARDS[key].icon} <b>${CARDS[key].name}</b> is in your hand. Tap it to use it.`, "info");
  }
}
async function next(){
  if (G && G.online) return;
  if (!G || G.phase!=="feedback" || modalOpen() || G.drafting) return;
  G.phase = "bots"; G.turnEvents = []; renderQuestion(); renderSide();
  for (const b of G.players.slice(1)){
    await sleep(650);
    if (G.over) return;
    botTurn(b);
    renderTrack(); renderQuestion();
    if (checkWin()) return;
  }
  await sleep(900);
  humanTurn();
}
function botTurn(b){
  const word = WORDS[Math.floor(Math.random()*WORDS.length)].w;
  if (Math.random() < b.acc){
    const tier = bumpStreak(b);
    const amt = advance(b);
    if (amt) addLog(`${who(b)} got <b>${word}</b> right: +${amt}.`);
    if (tier && !G.over){
      const key = botChoose(b, offer(tier));
      const c = CARDS[key];
      playCard(b, key, c.target==="one" ? botTarget(b) : null);
    }
  } else {
    b.streak = 0;
    addLog(`${who(b)} missed <b>${word}</b>.`);
  }
}
const DEFENSIVE = ["bulwark","fortify"], OFFENSIVE = ["rout","deluge","plunder","repel","pilfer","stymie","petrify"];
function botChoose(b, keys){
  const leader = Math.max(...G.players.map(p=>p.pos));
  const ahead = b.pos===leader;
  // A leading bot without a shield sometimes shields up; otherwise bots prefer to attack.
  const def = keys.filter(k=>DEFENSIVE.includes(k)), off = keys.filter(k=>OFFENSIVE.includes(k));
  if (ahead && !b.shield && def.length && Math.random()<.35) return def[0];
  if (off.length && Math.random()<.8) return off[Math.floor(Math.random()*off.length)];
  return keys[Math.floor(Math.random()*keys.length)];
}
function botTarget(b){
  const opps = G.players.filter(p=>p!==b);
  const top = Math.max(...opps.map(p=>p.pos));
  const lead = opps.filter(p=>p.pos===top && !p.shield);
  const pool = lead.length ? lead : opps.filter(p=>p.pos===top);
  return pool[Math.floor(Math.random()*pool.length)];
}
async function useCard(idx){
  if (G && G.online) return onlineUseCard(idx);
  if (!G || !["question","feedback"].includes(G.phase) || modalOpen() || G.drafting) return;
  const key = G.hand[idx], c = CARDS[key];
  let target = null;
  if (c.target==="one"){
    target = await targetModal(c);
    if (!target) return;
  }
  G.hand.splice(idx,1);
  playCard(me(), key, target);
  renderSide();
}

/* ------------------------------------------------------------------
   RENDERING
------------------------------------------------------------------- */
function renderQuestion(){
  const el = document.getElementById("qcard");
  if (!G) { el.innerHTML = ""; return; }
  if (G.online) return renderOnlineQuestion();
  if (G.phase==="bots"){
    const ev = G.turnEvents||[];
    el.innerHTML = `<div class="qmeta"><span class="chip">Rivals' turn</span></div>
      <ul class="turnEvents">${ev.map(h=>`<li>${h}</li>`).join("")}<li class="pending">…</li></ul>`;
    return;
  }
  if (G.phase==="over"){ el.innerHTML = `<div class="waiting">Race over!</div>`; return; }
  const q = G.q, s = stat(q.item.w), done = G.phase==="feedback";
  const ok = done && G.picked===q.answer;
  const keys = ["A","B","C","D"];
  let html = `<div class="qmeta">
      <span class="chip">${q.label}</span>
      ${q.wasMissed?`<span class="chip review">Review word</span>`:""}
      ${me().frozen && !done?`<span class="chip frozen">❄ Frozen: next correct answer won't move you</span>`:""}
      <span class="stageDots" title="Retrieval stage for this word">${[0,1,2,3].map(i=>`<i class="${i<Math.min(s.stage,4)?"on":""}"></i>`).join("")}</span>
    </div>
    <div class="stem">${q.stem}</div>
    <div class="opts">${q.options.map((o,i)=>{
      let cls = "";
      if (done){ cls = i===q.answer ? "right" : i===G.picked ? "wrong" : "dim"; }
      return `<button class="opt ${cls}" data-i="${i}" ${done?"disabled":""}><span class="k">${keys[i]}</span><span>${esc(o)}</span></button>`;
    }).join("")}</div>`;
  if (done){
    const it = q.item;
    const example = q.type==="context" ? it.cloze.replace("___", it.w) : it.ctx;
    const moveNote = ok ? (G.lastMoved ? `+${G.lastMoved} spaces` : `Frozen — no move this time`) : `No move; streak reset`;
    html += `<div class="feedback ${ok?"ok":"no"}">
      <h3>${ok?"Correct!":"Not quite."} <span style="font-weight:500;color:var(--muted);font-size:14px">· ${moveNote}</span></h3>
      <p><b>${it.w}</b> <i>${POS_ABBR[it.pos]}</i> — ${esc(it.def)}</p>
      <p class="ex">“${esc(example)}”</p>
      <div class="fbRow"><button class="btn primary" id="nextBtn">Next →</button><span class="hint">Enter ↵</span></div>
    </div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  const nb = document.getElementById("nextBtn"); if (nb) nb.onclick = next;
}
function cardHTML(key, tag="div", extra=""){
  const c = CARDS[key];
  return `<${tag} class="card ${c.tier===2?"power":""}" ${extra}>
    <span class="ic">${c.icon}</span>
    <span><span class="nm">${c.name}<em>${c.pos} ${c.gloss}</em></span><div class="ef">${c.effect}</div></span>
  </${tag}>`;
}
function renderSide(){
  if (!G) return;
  const p = me();
  document.getElementById("streak").innerHTML = [1,2,3,4,5].map(i=>
    `<div class="pip ${i<=p.streak?"on":""} ${i===3?"m3":""} ${i===5?"m5":""}"></div>`).join("");
  const canUse = G.online ? !!(NET.state && NET.state.status==="racing") : ["question","feedback"].includes(G.phase);
  const hand = document.getElementById("hand");
  hand.innerHTML = G.hand.length ? G.hand.map((k,i)=>cardHTML(k,"button",`data-i="${i}" ${canUse?"":"disabled"}`)).join("")
    : `<div class="empty">Answer 3 in a row to earn an attack.</div>`;
  hand.querySelectorAll("button.card").forEach(b=>b.onclick=()=>useCard(+b.dataset.i));
  document.getElementById("handPanel").classList.toggle("hasCards", G.hand.length>0);
}

let modalEl = null;
function modalOpen(){ return !!modalEl; }
function openModal(html, cls="", kind=""){
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "scrim";
  modalEl.dataset.kind = kind;
  modalEl.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(modalEl);
  return modalEl;
}
function closeModal(){ if (modalEl){ modalEl.remove(); modalEl = null; } }
const modalKind = () => (modalEl && modalEl.dataset.kind) || "";

function draftModal(tier, keys = offer(tier)){
  return new Promise(res=>{
    const m = openModal(`
      <h2>${tier===2?"Five in a row! Choose a power attack":"Three in a row! Choose an attack"}</h2>
      <p class="sub">It goes into your hand. Use it any time ${G && G.online ? "during the race" : "on your turn"}.</p>
      <div class="choices">${keys.map(k=>cardHTML(k,"button",`data-k="${k}"`)).join("")}</div>`, "", "draft");
    m.querySelectorAll("button.card").forEach(b=>b.onclick=()=>{ closeModal(); res(b.dataset.k); });
  });
}
function targetModal(card){
  return new Promise(res=>{
    const opps = G.players.filter(p=>!p.isMe).slice().sort((a,b)=>b.pos-a.pos);
    const m = openModal(`
      <h2>${card.icon} ${card.name}: choose a target</h2>
      <p class="sub">${card.effect}</p>
      <div class="targets">${opps.map(p=>`
        <button class="tgt" data-id="${p.id}">
          <span class="dot" style="background:${p.color}"></span>
          <b>${esc(p.name)}</b><span class="sp"></span>
          <small>space ${p.pos}/${G.len}${p.connected===false?" · away":""}${p.frozen?" · ❄ frozen":""}${p.shield?`<br><span style="color:var(--bad)">\u{1F6E1} Shielded: this would only break the shield</span>`:""}</small>
        </button>`).join("")}</div>
      <div class="rowEnd"><button class="btn" id="cancel">Keep it for later</button></div>`, "", "target");
    m.querySelectorAll(".tgt").forEach(b=>b.onclick=()=>{ closeModal(); res(G.players.find(p=>String(p.id)===b.dataset.id)); });
    m.querySelector("#cancel").onclick=()=>{ closeModal(); res(null); };
  });
}

  const m = openModal(`
    <h2>Word Rally</h2>

    <div class="rules">

      <ul>

        <li><b>3 in a row</b> earns an attack. <b>5 in a row</b> earns a power attack.</li>
        <li>Attacks knock rivals back, steal spaces, freeze them, shield you, or double your next move.</li>
        <li>Words you miss come back more often, in new kinds of questions, until you know them.</li>
      </ul>
    </div>
    <div class="field">${seg("mode",[["solo","Solo vs bots"],["online","Play with friends"]],mode)}</div>
    <div class="field"><label for="nm">Your name</label><input id="nm" maxlength="14" value="${esc(settings.name)}"><small id="welcome" style="color:var(--muted)"></small></div>
    <div id="soloOpts" ${mode==="online"?"hidden":""}>

      <div class="field"><label>Rivals</label>${seg("level",[["easy","Easy"],["medium","Medium"],["hard","Hard"]],settings.level)}</div>
      <div class="rowEnd"><button class="btn primary" id="go">Start race</button></div>
    </div>
    <div id="onlineOpts" ${mode==="solo"?"hidden":""}>
      ${hasServer ? `
      <div class="field"><label for="code">Join a room</label>
        <div class="joinRow"><input id="code" maxlength="4" placeholder="CODE" autocomplete="off" value="${esc((prefillCode||"").toUpperCase())}"><button class="btn primary" id="join">Join</button></div></div>
      <div class="field"><label>Or start one</label><div><button class="btn" id="create">Create a room</button></div></div>
      <p class="sub" style="font-size:13px">2 to 6 players. Everyone gets a question at the same time.</p>`
      : `<p class="note">Multiplayer needs the Word Rally server. Deploy it with the instructions in the README, then paste its WebSocket URL into <code>SERVER_URL</code> near the bottom of this page.</p>`}
    </div>`, "", "setup");
  m.querySelectorAll(".seg").forEach(sg=>sg.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    sg.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
    settings[sg.dataset.name] = b.dataset.v;
    if (sg.dataset.name === "mode"){
      m.querySelector("#soloOpts").hidden = b.dataset.v !== "solo";
      m.querySelector("#onlineOpts").hidden = b.dataset.v !== "online";
    }
  }));
  const nm = m.querySelector("#nm"), wb = m.querySelector("#welcome");
  const useName = ()=>{
    settings.name = (nm.value.trim() || "You");
    if (profileKey(settings.name) !== currentProfile) loadProfile(settings.name);
    saveProgress(); updateFoot();
  };
  const go = ()=>{ useName(); closeModal(); if (inRoom()) netLeave(); newGame(); };
  const connect = msg=>{
    useName(); closeModal();
    openModal(`<h2>Connecting…</h2><p class="sub">Reaching the game server.</p>`, "", "connecting");
    resetNet(); netOpen({...msg, name:settings.name});

    wb.textContent = !STORAGE_OK ? "Progress can't be saved in this browser, so it resets when the page closes."
      : sm ? `Welcome back! ${sm.seen} words seen, ${sm.cleared} cleared all four contexts, ${sm.missed} waiting for review.`
      : "Your progress will be saved in this browser under this name.";

  nm.oninput = showWelcome; showWelcome();

    codeIn.oninput = ()=>{ codeIn.value = codeIn.value.toUpperCase().replace(/[^A-Z]/g,""); };
    const doJoin = ()=>{ if (codeIn.value.length!==4){ toast("Room codes are 4 letters.","bad"); codeIn.focus(); return; } connect({action:"join", code:codeIn.value}); };
    m.querySelector("#join").onclick = doJoin;
    codeIn.onkeydown = e=>{ if (e.key==="Enter") doJoin(); };

function endScreen(winner){
  const won = winner.human;
  const acc = G.asked ? Math.round(100*G.correct/G.asked) : 0;
  const missed = [...G.missed.values()];
  const hot = WORDS.filter(x=>stat(x.w).seen).sort((a,b)=>weightOf(b.w)-weightOf(a.w)).slice(0,5).filter(x=>weightOf(x.w)>1);
  const m = openModal(`
    <h2>${won?"\u{1F3C1} You win!":`\u{1F3C1} ${esc(winner.name)} wins`}</h2>
    <p class="sub">${won?"Nice racing.":"Your missed words will come back more often next race."}</p>
    <div class="stat">
      <div><b>${G.correct}/${G.asked}</b><span>answered correctly</span></div>
      <div><b>${acc}%</b><span>accuracy</span></div>
      <div><b>${WORDS.filter(x=>stat(x.w).stage>=MASTERED).length}</b><span>words cleared all 4 contexts</span></div>
    </div>
    ${missed.length?`<p><b>Missed this race</b></p><ul class="missList">${missed.map(x=>`<li><b>${x.w}</b> — ${esc(x.def)}</li>`).join("")}</ul>`:`<p><b>No misses this race.</b></p>`}
    ${hot.length?`<p class="sub" style="margin-top:12px">Weighted heaviest for your next race: ${hot.map(x=>`<b>${x.w}</b> (${weightOf(x.w)}×)`).join(", ")}</p>`:""}
    <div class="rowEnd">
      <button class="btn" id="lab2">Word Lab</button>
      <button class="btn" id="settings">Change settings</button>
      <button class="btn primary" id="again">Race again</button>
    </div>`, "", "end");
  m.querySelector("#again").onclick=()=>{ closeModal(); newGame(); };
  m.querySelector("#settings").onclick=()=>{ closeModal(); setupScreen(); };
  m.querySelector("#lab2").onclick=()=>{ closeModal(); wordLab(()=>endScreen(winner)); };
}
function wordLab(onClose){
  const ch = drawChances();
  const maxCh = Math.max(...Object.values(ch));
  const sorted = WORDS.slice().sort((a,b)=>ch[b.w]-ch[a.w] || stat(b.w).seen-stat(a.w).seen || a.w.localeCompare(b.w));
  const row = x=>{
    const s = stat(x.w), w = weightOf(x.w), hot = w>1;
    const stageName = s.stage>=MASTERED ? "Cleared all 4" : STAGES[s.stage].label;
    const src = x.src.map(k=>SOURCE_ABBR[k]?`<span class="src" title="${SOURCE_ABBR[k][1]}">${SOURCE_ABBR[k][0]}</span>`:"").join("");
    return `<tr>
      <td class="w" title="${esc(x.def)}">${x.w} <span class="posTag">${POS_ABBR[x.pos]||""}</span></td>
      <td>${stageName}</td>
      <td><span class="hist">${s.hist.slice(-8).map(h=>`<i class="h${h}"></i>`).join("") || `<span style="color:var(--muted)">\u2014</span>`}</span></td>
      <td><span class="mult" style="color:${hot?"var(--bad)":"inherit"}">${w}\u00D7</span> <span style="color:var(--muted);font-size:12px">${weightLabel(x.w)}</span></td>
      <td>${ch[x.w]?`<span class="bar ${hot?"hot":""}"><span style="width:${100*ch[x.w]/maxCh}%"></span></span>${(100*ch[x.w]).toFixed(1)}%`:`<span style="color:var(--muted);font-size:12px">${recent.includes(x.w)?"cooling down":stat(x.w).seen?"after the new word":"waiting"}</span>`}</td>
      <td>${src}</td>
    </tr>`;
  };
  const seen = WORDS.filter(x=>stat(x.w).seen).length;
  const m = openModal(`
    <h2>Word Lab</h2>
    <p class="sub">How the question engine sees each of the ${WORDS.length} words right now (${seen} seen so far). Weights: new 1\u00D7 \u00B7 right once 0.7\u00D7 \u00B7 right 2+ in a row 0.4\u00D7 \u00B7 missed 3\u00D7 \u00B7 missed again 5\u00D7. The last ${COOLDOWN} words asked sit out so a missed word returns after a short gap. New words wait while ${ACTIVE_MAX} words are in progress (a word stays in progress until it has been answered right in ${GRADUATE} question types), and every ${NEW_EVERY}th question is a new word regardless. Each word works through four question types (Definition \u2192 In context \u2192 Complete the sentence \u2192 Name the word); a miss moves it back one.</p>
    <input class="labSearch" id="labSearch" placeholder="Search ${WORDS.length} words\u2026" autocomplete="off">
    <div style="overflow-x:auto"><table class="lab">
      <thead><tr><th>Word</th><th>Next context</th><th>History</th><th>Weight</th><th>Chance next</th><th>Source</th></tr></thead>
      <tbody id="labBody"></tbody>
    </table></div>
    <p class="sub" style="font-size:12px;margin-top:10px">Sources: ${Object.values(SOURCE_ABBR).map(([a,t])=>`<b>${a}</b> ${t.split(":")[0]}`).join(" \u00B7 ")}. Hover a word to see its definition.</p>
    <div class="rowEnd">
      <button class="btn" id="reset">Reset learning data</button>
      <button class="btn primary" id="close">Close</button>
    </div>`, "wide", "lab");
  const body = m.querySelector("#labBody");
  const draw = q=>{
    q = q.trim().toLowerCase();
    const list = q ? sorted.filter(x=>x.w.includes(q) || (q.length>=4 && x.def.toLowerCase().includes(q))) : sorted;
    body.innerHTML = list.slice(0,200).map(row).join("") +
      (list.length>200?`<tr><td colspan="6" style="color:var(--muted)">\u2026${list.length-200} more \u2014 search to narrow</td></tr>`:"");
  };
  draw("");
  m.querySelector("#labSearch").oninput = e=>draw(e.target.value);
  const done = ()=>{ closeModal(); if (onClose) onClose(); };
  m.querySelector("#close").onclick = done;
  m.querySelector("#reset").onclick = ()=>{
    if (!confirm(`Forget all word history for ${settings.name}? Every word goes back to new.`)) return;
    Object.keys(STATS).forEach(k=>delete STATS[k]); recent.length = 0;
    saveProgress();
    wordLab(onClose);
  };
  m.onclick = e=>{ if (e.target===m) done(); };
}

document.addEventListener("keydown", e=>{
  if (modalOpen() || !G || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName==="INPUT") return;
  const k = e.key.toLowerCase();
  if (G.phase==="question"){
    const i = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
    if (i>=0){ e.preventDefault(); answer(i); }
  } else if (G.phase==="feedback" && (k==="enter" || k===" ")){
    e.preventDefault(); next();
  }
});

/* ------------------------------------------------------------------
   ONLINE MULTIPLAYER
   The server (AWS Lambda behind an API Gateway WebSocket, or the local
   dev server) owns the race: it builds each question, checks answers,
   applies attacks and decides when a round ends. This page renders the
   server's state and keeps running the adaptive word engine locally: it
   tells the server which word to ask next and records results in this
   browser's saved progress.
------------------------------------------------------------------- */
// Paste the WebSocketUrl printed by `sam deploy`, e.g. "wss://abc123.execute-api.us-east-1.amazonaws.com/prod".
// A ?server=... parameter in the page URL overrides it (handy for local testing).
const SERVER_URL = "wss://2owywo7buf.execute-api.us-east-1.amazonaws.com/prod";
const PAGE_PARAMS = new URLSearchParams(location.search);
const serverUrl = () => PAGE_PARAMS.get("server") || SERVER_URL;
const SESSION_KEY = "wordRally.session";
const NET = { ws:null, session:null, state:null, version:0, offset:0, seq:-1, recorded:new Set(), sentPick:null,
              tickRound:0, tickAt:0, retry:0, wantOpen:false, pending:null, offerShown:null, endShown:null,
              timer:null, ping:null, lastPos:{}, lastStatus:null, roundSeqStart:null, revealFrom:0 };
function sessLoad(){ try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch (e) { return null; } }
function sessSave(v){ try { v ? sessionStorage.setItem(SESSION_KEY, JSON.stringify(v)) : sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
const serverNow = () => Date.now() + NET.offset;
const pColor = i => `var(--p${i})`;
const inRoom = () => !!NET.session;
const TYPE_LABEL = {def:"Definition", context:"In context", cloze:"Complete the sentence", describe:"Name the word"};
function setRoomParam(code){
  try { const u = new URL(location.href); code ? u.searchParams.set("room", code) : u.searchParams.delete("room"); history.replaceState(null, "", u); } catch (e) {}
}
function shareLink(code){
  try {
    const u = new URL(location.href); u.search = ""; u.hash = "";
    u.searchParams.set("room", code);
    if (PAGE_PARAMS.get("server")) u.searchParams.set("server", PAGE_PARAMS.get("server"));
    return u.toString();
  } catch (e) { return code; }
}

/* ---- connection ---- */
function netSend(obj){
  if (NET.ws && NET.ws.readyState === 1){ NET.ws.send(JSON.stringify(obj)); return true; }
  return false;
}
function netOpen(firstMsg){
  const url = serverUrl();
  if (!url){ toast("Multiplayer isn't set up yet: add your server's URL to the page (see the README).", "bad"); return; }
  if (NET.ws && NET.ws.readyState <= 1){
    if (firstMsg){ if (NET.ws.readyState === 1) netSend(firstMsg); else NET.pending = firstMsg; }
    return;
  }
  NET.wantOpen = true; NET.pending = firstMsg || null;
  let ws;
  try { ws = new WebSocket(url); } catch (e) { toast("Couldn't reach the game server.", "bad"); return; }
  NET.ws = ws;
  ws.onopen = ()=>{
    NET.retry = 0;
    if (NET.pending){ netSend(NET.pending); NET.pending = null; }
    else if (NET.session) netSend({action:"rejoin", ...NET.session});
    clearInterval(NET.ping);
    NET.ping = setInterval(()=>netSend({action:"ping"}), 4*60*1000);   // API Gateway drops idle sockets after 10 min
  };
  ws.onmessage = e=>{ let m; try { m = JSON.parse(e.data); } catch (_) { return; } onNet(m); };
  ws.onclose = ()=>{
    if (NET.ws !== ws) return;
    NET.ws = null; clearInterval(NET.ping);
    if (NET.wantOpen && NET.session){
      const d = Math.min(8000, 600 * 2 ** NET.retry++);
      if (NET.retry === 1) toast("Connection lost. Reconnecting…", "info");
      setTimeout(()=>{ if (NET.wantOpen && !NET.ws) netOpen(null); }, d);
    } else if (NET.wantOpen){
      NET.wantOpen = false;
      if (modalKind() === "connecting"){ closeModal(); setupScreen(PAGE_PARAMS.get("room") || ""); }
      toast("Couldn't connect to the game server.", "bad");
    }
  };
}
function resetNet(){
  clearInterval(NET.timer); NET.timer = null;
  Object.assign(NET, { state:null, version:0, seq:-1, sentPick:null, tickRound:0, offerShown:null, endShown:null,
                       lastPos:{}, lastStatus:null, roundSeqStart:null, revealFrom:0 });
  NET.recorded.clear();
}
function netLeave(){
  netSend({action:"leave"});
  NET.wantOpen = false; NET.session = null; sessSave(null); setRoomParam(null);
  const ws = NET.ws; NET.ws = null; clearInterval(NET.ping);
  if (ws) setTimeout(()=>{ try { ws.close(); } catch (e) {} }, 300);
  resetNet();
  G = null; closeModal(); clearBoard();
}
function clearBoard(){
  document.getElementById("track").innerHTML = "";
  document.getElementById("qcard").innerHTML = "";
  document.getElementById("hand").innerHTML = "";
  document.getElementById("log").innerHTML = "";
  document.getElementById("streak").innerHTML = "";
}

function onNet(m){
  if (m.type === "joined"){
    if (!NET.session || NET.session.code !== m.code) resetNet();
    NET.session = {code:m.code, playerId:m.playerId, token:m.token};
    sessSave(NET.session); setRoomParam(m.code);
    return;
  }
  if (m.type === "error"){
    const fatal = ["rejoin_failed", "not_in_room"].includes(m.code) || (m.code === "no_room" && NET.session);
    if (fatal){
      NET.wantOpen = false; NET.session = null; sessSave(null); setRoomParam(null);
      try { NET.ws && NET.ws.close(); } catch (e) {}
      NET.ws = null; resetNet(); G = null; clearBoard();
      setupScreen("");
      toast("That room is no longer available. Create or join another one.", "bad");
      return;
    }
    if (!NET.session && modalKind() === "connecting"){
      closeModal(); setupScreen(PAGE_PARAMS.get("room") || "");
      NET.wantOpen = false; try { NET.ws && NET.ws.close(); } catch (e) {}
    }
    toast(esc(m.message), "bad");
    return;
  }
  if (m.type === "state"){
    if (m.version < NET.version) return;          // an older broadcast arriving late
    NET.version = m.version;
    NET.offset = m.now - Date.now();
    NET.state = m;
    applyOnline(m);
  }
}

/* ---- applying server state ---- */
const takeoverOK = () => !modalOpen() || ["lobby","end","connecting","draft","target"].includes(modalKind());
function applyOnline(s){
  const meId = s.you && s.you.id;
  if (!meId) return;
  const first = NET.seq < 0;
  for (const ev of s.events){
    if (ev.seq <= NET.seq) continue;
    NET.seq = ev.seq;
    if (!first) onlineEvent(s, ev, meId);
  }
  if (s.status === "lobby"){
    if (G && G.online){ G = null; clearBoard(); }
    NET.endShown = null; NET.lastStatus = "lobby";
    if (!NET.sentPick){ NET.sentPick = computePick(null); netSend({action:"pick", ...NET.sentPick}); }
    if (takeoverOK()) lobbyModal(s);
    return;
  }
  syncOnlineG(s, meId);
  NET.lastStatus = s.status;
  if (s.status === "racing"){
    if (["lobby","end","connecting"].includes(modalKind())) closeModal();
    handleOnlineQuestion(s);
    G.phase = onlinePhase(s);
    maybeOffer(s);
  } else {
    G.phase = "over";
  }
  renderTrack(); renderSide(); renderQuestion();
  if (s.status === "over"){
    const key = s.winnerId + ":" + s.version;
    if (!NET.endShown && takeoverOK()){ NET.endShown = key; onlineEndScreen(s); }
  }
  if (!NET.timer) NET.timer = setInterval(onlineTick, 200);
}

function syncOnlineG(s, meId){
  const ids = s.players.map(p=>p.id).join(",");
  const newRace = s.status === "racing" && NET.lastStatus !== "racing" && NET.lastStatus !== null;
  if (!G || !G.online || G.ids !== ids || G.len !== s.settings.len || newRace || !G.started){
    const keepLog = G && G.online && !newRace ? G.log : [];
    G = { online:true, started:true, ids, len:s.settings.len,
          players: s.players.map(p=>({id:p.id, name:p.name, color:pColor(p.color), isMe:p.id===meId, human:true,
                                       connected:p.connected, pos:p.pos, streak:p.streak, shield:p.shield, frozen:p.frozen, dbl:p.dbl})),
          hand:[], log:keepLog, phase:"waiting", q:null, qRound:0, picked:null, over:false, asked:0, correct:0, missed:new Map() };
    NET.lastPos = {};
    buildTrack();
    document.getElementById("log").innerHTML = G.log.map(h=>`<li>${h}</li>`).join("");
  }
  for (const sp of s.players){
    const gp = G.players.find(p=>p.id===sp.id);
    Object.assign(gp, {pos:sp.pos, streak:sp.streak, shield:sp.shield, frozen:sp.frozen, dbl:sp.dbl, connected:sp.connected});
    const prev = NET.lastPos[sp.id];
    if (prev != null && prev !== sp.pos) fx(gp, (sp.pos > prev ? "+" : "−") + Math.abs(sp.pos - prev), sp.pos > prev ? "var(--good)" : "var(--bad)");
    NET.lastPos[sp.id] = sp.pos;
    const small = document.querySelector(`#lane${sp.id} .laneName small`);
    if (small) small.textContent = sp.id===meId ? "you" : sp.connected ? (sp.answered && s.status==="racing" ? "answered" : "") : "away";
  }
  G.hand = s.you.hand.slice();
  G.over = s.status === "over";
}

// The client chooses which word the server should ask next, using this browser's
// adaptive weights. `exclude` is the word currently on screen.
function computePick(exclude){
  const saved = recent.slice();
  const savedSince = sinceNew;
  if (exclude && !recent.includes(exclude)) recent.push(exclude);
  if (exclude) sinceNew = stat(exclude).seen ? sinceNew + 1 : 0;   // count the question on screen
  const item = pickWord();
  recent.length = 0; recent.push(...saved); sinceNew = savedSince;
  return {word:item.w, stage:stat(item.w).stage};
}
function maxSeq(s){ return s.events.reduce((m,e)=>Math.max(m,e.seq), 0); }
function handleOnlineQuestion(s){
  const q = s.you.question;
  if (q && q.round !== G.qRound){
    G.qRound = q.round; G.picked = null;
    NET.revealFrom = NET.roundSeqStart ?? Math.max(0, maxSeq(s) - 6);
    NET.roundSeqStart = maxSeq(s);
    NET.askedPick = NET.sentPick;   // the word we asked for this round (when the question hides it)
    const current = q.word || (NET.sentPick && NET.sentPick.word) || null;
    NET.sentPick = computePick(current);
    netSend({action:"pick", ...NET.sentPick});   // the server needs it before this round ends
  }
  if (q && q.result && !NET.recorded.has(q.round)) recordOnline(q.result.word, q.result.correct, q.round);
  const last = s.you.last;
  if (last && last.timedOut && !NET.recorded.has(last.round)) recordOnline(last.word, false, last.round);
}
function recordOnline(word, ok, round){
  NET.recorded.add(round);
  const item = WORDS.find(x=>x.w===word);
  if (!item) return;
  recordAnswer(item, ok); saveProgress();
  G.asked++; if (ok) G.correct++; else G.missed.set(item.w, item);
}
function onlinePhase(s){
  const r = s.round, q = s.you.question;
  if (!r || !q) return "waiting";
  if (serverNow() < r.startsAt) return "reveal";
  if (q.answered) return "feedback";
  return G.picked != null ? "sent" : "question";
}
function onlineTick(){
  const s = NET.state;
  if (!s || s.status !== "racing" || !G || !G.online) return;
  const r = s.round, now = serverNow();
  const phase = onlinePhase(s);
  if (phase !== G.phase){ G.phase = phase; renderQuestion(); renderSide(); }
  const fill = document.getElementById("timerFill");
  if (fill){
    const f = Math.max(0, Math.min(1, (r.deadline - now) / (r.deadline - r.startsAt)));
    fill.style.width = (100*f) + "%"; fill.classList.toggle("low", f < 0.25);
  }
  const cd = document.getElementById("countdown"); if (cd) cd.textContent = Math.max(1, Math.ceil((r.startsAt - now)/1000));
  const sl = document.getElementById("secsLeft"); if (sl) sl.textContent = Math.max(0, Math.ceil((r.deadline - now)/1000)) + "s";
  // Lambda has no timers, so clients nudge the server when the deadline passes; it checks its own clock.
  if (now >= r.deadline && (NET.tickRound !== r.n || Date.now() - NET.tickAt > 2500)){
    NET.tickRound = r.n; NET.tickAt = Date.now();
    netSend({action:"tick", round:r.n});
  }
}
function maybeOffer(s){
  const off = s.you.offer;
  if (!off) return;
  const key = (s.round ? s.round.n : 0) + ":" + off.tier + ":" + off.keys.join(",");
  if (NET.offerShown === key || modalOpen()) return;
  NET.offerShown = key;
  draftModal(off.tier, off.keys).then(k=>{ netSend({action:"choose", card:k}); });
}
function onlineEvent(s, ev, meId){
  const html = esc(ev.text).replace(/\{(p\d+)\}/g, (_, id)=>{
    const p = s.players.find(x=>x.id===id);
    return p ? `<span class="who" style="color:${pColor(p.color)}">${esc(p.id===meId ? "You" : p.name)}</span>` : "Someone";
  });
  if (G && G.online) addLog(html);
  const targeted = (ev.targets||[]).includes(meId);
  if (ev.kind === "card" && ev.actor === meId) toast(html, "good");
  else if (ev.kind === "card" && targeted) toast(html, "bad");
  else if (ev.kind === "blocked" && targeted) toast(html, "good");
  else if (ev.kind === "blocked" && ev.actor === meId) toast(html + " (Their shield is used up.)", "info");
  else if (ev.kind === "win") toast(html, ev.actor === meId ? "good" : "info");
  else if (ev.kind === "info" && s.status === "racing" && /disconnected|is back|left/.test(ev.text)) toast(html, "info");
}

/* ---- player actions ---- */
function onlineAnswer(i){
  const s = NET.state, q = s && s.you && s.you.question;
  if (!q || q.answered || G.phase !== "question" || modalOpen()) return;
  G.picked = i; G.phase = "sent";
  netSend({action:"answer", round:q.round, choice:i, nextPick:NET.sentPick});
  renderQuestion();
}
async function onlineUseCard(idx){
  const s = NET.state;
  if (!s || s.status !== "racing" || modalOpen()) return;
  const key = G.hand[idx], c = CARDS[key];
  let target = null;
  if (c.target === "one"){ target = await targetModal(c); if (!target) return; }
  netSend({action:"play", card:key, target: target ? target.id : undefined});
}

/* ---- rendering ---- */
function renderOnlineQuestion(){
  const el = document.getElementById("qcard");
  const s = NET.state;
  if (!s || !G){ el.innerHTML = ""; return; }
  if (s.status === "over"){ el.innerHTML = `<div class="waiting">Race over!</div>`; return; }
  const q = s.you.question, r = s.round;
  if (!q || !r){ el.innerHTML = `<div class="waiting">Waiting for the next question…</div>`; return; }
  const now = serverNow();
  if (now < r.startsAt){
    const evs = s.events.filter(e=>e.seq > NET.revealFrom).map(e=>esc(e.text).replace(/\{(p\d+)\}/g,(_,id)=>{
      const p = s.players.find(x=>x.id===id); return p ? `<span class="who" style="color:${pColor(p.color)}">${esc(p.id===s.you.id?"You":p.name)}</span>` : "Someone"; }));
    el.innerHTML = `<div class="qmeta"><span class="chip">Round ${r.n}</span></div>
      <div class="reveal"><div class="cd" id="countdown">${Math.max(1, Math.ceil((r.startsAt-now)/1000))}</div><div>${r.n===1?"Get ready!":"Next question coming up"}</div></div>
      ${r.n > 1 && evs.length ? `<h4 class="revealHead">Last round</h4><ul class="turnEvents">${evs.map(h=>`<li>${h}</li>`).join("")}</ul>` : ""}`;
    return;
  }
  const keys = ["A","B","C","D"];
  const known = q.word ? WORDS.find(x=>x.w===q.word) : null;
  const wasMissed = known && stat(known.w).wrong > 0 && !q.result;
  let stem;
  if (q.type === "def") stem = `<span class="big">${esc(q.word)}</span>most nearly means…`;
  else if (q.type === "context") stem = `<blockquote>${highlight(q.sentence, q.word)}</blockquote>As used in the sentence, <b>${esc(q.word)}</b> most nearly means…`;
  else if (q.type === "cloze") stem = `<blockquote>${esc(q.sentence).replace("___",'<span class="blank"></span>')}</blockquote>Which word best completes the sentence?`;
  else stem = esc(q.prompt);
  const res = q.result, locked = !!res || G.picked != null;
  let html = `<div class="qmeta">
      <span class="chip">Round ${r.n} · ${TYPE_LABEL[q.type]}</span>
      ${wasMissed ? `<span class="chip review">Review word</span>` : ""}
      ${me().frozen && !res ? `<span class="chip frozen">❄ Frozen: a correct answer won't move you</span>` : ""}
      <span class="secsLeft" id="secsLeft"></span>
    </div>
    <div class="timer"><span id="timerFill"></span></div>
    <div class="stem">${stem}</div>
    <div class="opts">${q.options.map((o,i)=>{
      let cls = "";
      if (res) cls = i===res.answer ? "right" : i===res.choice ? "wrong" : "dim";
      else if (G.picked === i) cls = "pending";
      return `<button class="opt ${cls}" data-i="${i}" ${locked?"disabled":""}><span class="k">${keys[i]}</span><span>${esc(o)}</span></button>`;
    }).join("")}</div>`;
  if (res){
    const it = WORDS.find(x=>x.w===res.word);
    const waiting = r.answered < r.of ? `Waiting for others: ${r.answered} of ${r.of} answered.` : "Everyone has answered.";
    html += `<div class="feedback ${res.correct?"ok":"no"}">
      <h3>${res.correct ? "Correct!" : "Not quite."} <span style="font-weight:500;color:var(--muted);font-size:14px">· ${res.correct ? "you move when the round ends" : "no move; streak reset"}</span></h3>
      ${it ? `<p><b>${it.w}</b> <i>${POS_ABBR[it.pos]||""}</i> — ${esc(it.def)}</p><p class="ex">“${esc(q.type==="context" ? it.cloze.replace("___", it.w) : it.ctx)}”</p>` : ""}
      <div class="fbRow"><span class="hint">${waiting}</span></div>
    </div>`;
  } else if (G.picked != null){
    html += `<div class="fbRow"><span class="hint">Checking your answer…</span></div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  onlineTick();
}

function lobbyModal(s){
  const meId = s.you.id, isHost = s.hostId === meId;
  const live = s.players.filter(p=>p.connected).length;
  const link = shareLink(s.code);
  const seg = (name, opts, val) => `<div class="seg" data-name="${name}">${opts.map(([v,l])=>`<button data-v="${v}" class="${v===val?"on":""}">${l}</button>`).join("")}</div>`;
  const html = `
    <h2>Room <span class="roomCode">${esc(s.code)}</span></h2>
    <p class="sub">Friends join with this code, or you can send them the link.</p>
    <div class="joinRow"><input id="shareLink" readonly value="${esc(link)}"><button class="btn" id="copy">Copy link</button></div>
    <h4 class="lobbyHead">Players (${live} of 6)</h4>
    <ul class="lobbyList">${s.players.map(p=>`<li><span class="dot" style="background:${pColor(p.color)}"></span><b>${esc(p.name)}</b>${p.id===s.hostId?' <span class="tag">host</span>':''}${p.id===meId?' <span class="tag">you</span>':''}${p.connected?'':' <span class="tag">away</span>'}</li>`).join("")}</ul>
    <div class="field"><label>Race length</label>${isHost ? seg("len",[[20,"20 spaces"],[30,"30 spaces"],[40,"40 spaces"]], s.settings.len) : `<div>${s.settings.len} spaces</div>`}</div>
    <div class="field"><label>Time per question</label>${isHost ? seg("roundSecs",[[15,"15 s"],[20,"20 s"],[30,"30 s"]], s.settings.roundSecs) : `<div>${s.settings.roundSecs} seconds</div>`}</div>
    <p class="sub" style="font-size:14px">Everyone gets a question at the same moment. A round ends when all players have answered or time runs out; then everyone who was right moves together.</p>
    <div class="rowEnd"><button class="btn" id="leave">Leave room</button>
      ${isHost ? `<button class="btn primary" id="startBtn" ${live<2?"disabled":""}>${live<2?"Waiting for players…":"Start race"}</button>`
               : `<span class="hint" style="align-self:center">Waiting for the host to start…</span>`}</div>`;
  let m;
  if (modalKind() === "lobby"){ m = modalEl; m.querySelector(".modal").innerHTML = html; }
  else m = openModal(html, "", "lobby");
  m.querySelectorAll(".seg").forEach(sg=>sg.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    netSend({action:"settings", ...s.settings, [sg.dataset.name]: Number(b.dataset.v)});
  }));
  m.querySelector("#copy").onclick = ()=>{
    const inp = m.querySelector("#shareLink");
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
      .then(()=>toast("Link copied.", "good"))
      .catch(()=>{ inp.select(); toast("Select the link and copy it.", "info"); });
  };
  m.querySelector("#leave").onclick = ()=>{ netLeave(); setupScreen(""); };
  const sb = m.querySelector("#startBtn"); if (sb) sb.onclick = ()=>netSend({action:"start"});
}

function onlineEndScreen(s){
  const meId = s.you.id, isHost = s.hostId === meId;
  const winner = s.players.find(p=>p.id===s.winnerId);
  const standings = s.players.slice().sort((a,b)=>b.pos-a.pos);
  const missed = G ? [...G.missed.values()] : [];
  const acc = G && G.asked ? Math.round(100*G.correct/G.asked) : 0;
  const m = openModal(`
    <h2>\u{1F3C1} ${winner ? (winner.id===meId ? "You win!" : esc(winner.name) + " wins") : "Race over"}</h2>
    <ol class="standings">${standings.map(p=>`<li><span class="dot" style="background:${pColor(p.color)}"></span><b>${esc(p.name)}</b>${p.id===meId?' <span class="tag">you</span>':''}<span class="sp"></span>${p.pos}/${s.settings.len}</li>`).join("")}</ol>
    <div class="stat">
      <div><b>${G ? G.correct : 0}/${G ? G.asked : 0}</b><span>you answered correctly</span></div>
      <div><b>${acc}%</b><span>accuracy</span></div>
    </div>
    ${missed.length ? `<p><b>Your missed words</b></p><ul class="missList">${missed.map(x=>`<li><b>${x.w}</b> — ${esc(x.def)}</li>`).join("")}</ul>` : ""}
    <div class="rowEnd">
      <button class="btn" id="leave">Leave room</button>
      ${isHost ? `<button class="btn primary" id="again">New race, same room</button>` : `<span class="hint" style="align-self:center">The host can start another race.</span>`}
    </div>`, "", "end");
  m.querySelector("#leave").onclick = ()=>{ netLeave(); setupScreen(""); };
  const ag = m.querySelector("#again"); if (ag) ag.onclick = ()=>netSend({action:"again"});
}

function updateFoot(){
  document.getElementById("foot").textContent = `Word Rally \u00B7 ${WORDS.length} SAT words${WORD_SOURCE?" (from "+WORD_SOURCE+")":""} \u00B7 ${STORAGE_OK ? `progress saved in this browser for ${settings.name}` : "progress lasts until you close the page"}`;
}
let WORD_SOURCE = "";
// On a web host, a words.json next to this page overrides the built-in list (same fields as the built-in data).
(async function loadExternalWords(){
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch("words.json", {cache:"no-cache"});
    if (!r.ok) return;
    const data = await r.json();
    const ok = Array.isArray(data) && data.length >= 8 &&
      data.every(e => e && e.word && e.pos && e.definition && e.contextSentence && e.clozeSentence && e.description);
    if (ok && !G){ WORDS = toBank(data); WORD_SOURCE = "words.json"; updateFoot(); }
  } catch (e) { /* no words.json (or opened from disk): use the built-in list */ }
})();
updateFoot();
// Back in a room after a reload? Rejoin it. Otherwise open the menu (a ?room=CODE link pre-fills the code).
NET.session = sessLoad();
if (NET.session && serverUrl()){
  openModal(`<h2>Reconnecting…</h2><p class="sub">Rejoining room ${esc(NET.session.code)}.</p>`, "", "connecting");
  netOpen(null);
} else {
  NET.session = null;
  setupScreen(PAGE_PARAMS.get("room") || "");
}
</script>
</body>
</html>
